<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; script-src 'self';" />
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card surface-card" id="card">
    <div class="conn" id="conn"></div>
    <div class="shield" id="shield">
      <div class="shield-text">
        <div class="shield-title" data-i18n="site.protections">Protections</div>
        <div class="shield-desc" id="shield-desc" data-i18n="site.protectionsOn">Blocking ads and trackers on this site</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="shield-toggle" aria-label="Block ads and trackers" data-i18n-label="site.protectionsToggle">
        <span class="switch-track"></span>
      </label>
    </div>
    <div class="section">
      <div class="surface-label" data-i18n="site.permissions">Permissions</div>
      <div id="perms" class="perms"></div>
    </div>
    <button class="clear surface-foot" id="clear" data-i18n="site.clear">Clear cookies and site data</button>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="siteinfo.js"></script>
</body>
</html>
