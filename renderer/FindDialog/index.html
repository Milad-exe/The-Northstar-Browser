<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; script-src 'self';" />
    <title>Find</title>
    <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="find-container">
        <!-- One row, the way every browser draws it: the field, then how many
             matches, then the two ways to move through them, then done. -->
        <div class="find-bar surface-card">
            <input type="text" id="find-input" placeholder="Find in page" autofocus
                   aria-label="Find in page" data-i18n-placeholder="menu.find" data-i18n-label="menu.find">
            <span id="match-counter" class="match-counter"></span>
            <div class="find-nav">
                <button id="prev-btn" class="surface-icon-btn find-btn" title="Previous match" aria-label="Previous match" data-i18n-title="find.prev" data-i18n-label="find.prev">
                    <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216.49,168.49a12,12,0,0,1-17,0L128,97,56.49,168.49a12,12,0,0,1-17-17l80-80a12,12,0,0,1,17,0l80,80A12,12,0,0,1,216.49,168.49Z"/></svg>
                </button>
                <button id="next-btn" class="surface-icon-btn find-btn" title="Next match" aria-label="Next match" data-i18n-title="find.next" data-i18n-label="find.next">
                    <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216.49,104.49l-80,80a12,12,0,0,1-17,0l-80-80a12,12,0,0,1,17-17L128,159l71.51-71.52a12,12,0,0,1,17,17Z"/></svg>
                </button>
            </div>
            <button id="close-btn" class="surface-icon-btn" title="Close" aria-label="Close" data-i18n-title="chrome.close" data-i18n-label="chrome.close">
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/></svg>
            </button>
        </div>
    </div>
    <script src="../lib/i18n.js"></script>
    <script src="find.js"></script>
</body>
</html>
