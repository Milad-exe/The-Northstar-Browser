<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:;" />
  <title>Permission</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card surface-card" id="card">
    <div class="head">
      <span class="icon" id="icon"></span>
      <div class="head-text">
        <div class="q" id="q">Allow access?</div>
        <div class="host" id="host"></div>
      </div>
    </div>
    <label class="remember" id="remember-row">
      <input type="checkbox" class="check-box" id="remember" checked>
      <span data-i18n="perm.remember">Remember this decision</span>
    </label>
    <div class="actions">
      <button class="btn btn-ghost block" id="block" data-i18n="site.block">Block</button>
      <button class="btn btn-primary allow" id="allow" data-i18n="site.allow">Allow</button>
    </div>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/permission-icons.js"></script>
  <script src="prompt.js"></script>
</body>
</html>
