<!--
  Northstar: the browser's mark. "The tilted globe": a paper globe sticker in
  heavy ink, tipped 23.5 degrees like the Earth so its north pole points at the
  north star on its rim (the Earth's axis points at Polaris). No tile, except on macOS.

  Source of truth. Generated by docs/claude-setup/icon/globe.py (fill 0.86).
  The PNG/ICO/ICNS binaries are rendered from this design:
    logo.png        1024, macOS/Linux (mark at 80% of the canvas)
    logo-win.png    1024, Windows (mark fills the square, no drop shadow,
                    to sit the same size as other apps on the taskbar)
    icons/icon.ico  16-256 from logo-win, 16-32 use thicker ink and a bigger star
    logo-mac.png    1024, macOS: the sticker at 80% of an 824 ink (#0e0e10) squircle
    icons/icon.icns 16-1024 from logo-mac
    icons/icon.png  = logo.png (electron-builder, Linux)
-->
