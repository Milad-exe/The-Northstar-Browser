<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; script-src 'self';" />
  <title>This page stopped responding</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <script src="../lib/i18n.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; font-family: var(--font);
      background: var(--page); color: var(--text);
      overflow: hidden; -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
    }
    .scene {
      position: fixed; inset: 0;
      background:
        radial-gradient(120% 82% at 50% 0%, var(--accent-wash), transparent 60%),
        linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 44%, var(--page) 100%);
    }
    .stage {
      position: relative; z-index: 1; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 40px; text-align: center;
    }
    .glyph { color: var(--text-3); margin-bottom: 18px; }
    .title { font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; letter-spacing: -0.02em; }
    .detail { font-size: 14px; color: var(--text-2); margin-top: 10px; max-width: 460px; line-height: 1.5; }
    .url { font-family: var(--mono); font-size: var(--fs-body); color: var(--text-3); margin-top: 10px; max-width: 560px; word-break: break-all; user-select: text; }
    .reason { font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-top: 8px; letter-spacing: 0.04em; }
    .actions { display: flex; gap: 10px; margin-top: 26px; }
    /* Buttons are shared — see SHARED CONTROLS in renderer/styles/ui.css. */
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <main class="stage">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="9" width="36" height="26" rx="3"/><path d="M16 41h16"/><path d="M19 18l10 8M29 18l-10 8"/>
      </svg>
    </div>
    <h1 class="title" id="title" data-i18n="crash.title">This page stopped responding</h1>
    <p class="detail" id="detail" data-i18n="crash.detail">Its process ended unexpectedly. Reloading usually brings it back — the rest of your tabs are untouched.</p>
    <p class="url" id="url"></p>
    <p class="reason" id="reason"></p>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-back" data-i18n="crash.back">Go back</button>
      <button class="btn btn-primary" id="btn-reload" data-i18n="crash.reload">Reload page</button>
    </div>
  </main>
  <script src="page.js"></script>
</body>
</html>
