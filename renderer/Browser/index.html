<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Northstar</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Firefox-style menu bar, hidden until Alt is tapped. Windows only: the
       frameless window has no OS-drawn menu bar (mac uses the system bar, Linux
       the native framed one). Rows are built and driven by renderer.js via
       window.menubar → features/menu-bar.js. Sits at the very top and reflows
       the page card through the shared reportChromeHeight channel. -->
  <div id="menu-bar" class="menu-bar hidden" role="menubar" aria-label="Application menu"></div>

  <!-- Tab Bar (top strip — sits beside the native window controls) -->
  <div id="utility-bar">
    <!-- The sidebar column: the toggle that owns the sidebar, and nothing else.
         Sized to the rail's width so what follows begins where the rail ends —
         see .lead-cluster in styles.css. -->
    <div class="lead-cluster">
      <!-- Compact mode: hide/show the sidebar -->
      <button id="compact-btn" class="icon-btn" title="Toggle compact mode" data-i18n-title="chrome.compact">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,36H40A20,20,0,0,0,20,56V200a20,20,0,0,0,20,20H216a20,20,0,0,0,20-20V56A20,20,0,0,0,216,36ZM44,60H76V196H44ZM212,196H100V60H212Z"/></svg>
      </button>
    </div>
    <!-- Page-scoped navigation. It sits OVER THE PAGE CARD, not over the rail:
         back/forward/reload act on the page, so they begin where the page
         begins. The field shortens by exactly this cluster's width. -->
    <div class="nav-buttons">
      <button id="back-btn" class="nav-btn" title="Back" data-i18n-title="chrome.back">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"/></svg>
      </button>
      <button id="forward-btn" class="nav-btn" title="Forward" data-i18n-title="chrome.forward">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.48a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"/></svg>
      </button>
      <button id="reload-btn" class="nav-btn" title="Reload" data-i18n-title="chrome.reload">
        <svg class="nav-reload" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M244,56v48a12,12,0,0,1-12,12H184a12,12,0,1,1,0-24H201.1l-19-17.38c-.13-.12-.26-.24-.38-.37A76,76,0,1,0,127,204h1a75.53,75.53,0,0,0,52.15-20.72,12,12,0,0,1,16.49,17.45A99.45,99.45,0,0,1,128,228h-1.37A100,100,0,1,1,198.51,57.06L220,76.72V56a12,12,0,0,1,24,0Z"/></svg>
        <svg class="nav-stop" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/></svg>
      </button>
    </div>
    <div class="omnibox-wrapper">
      <div class="omnibox" data-omni="search">
        <button class="omni-icon" id="omni-icon" type="button" aria-label="Site information" data-i18n-label="chrome.siteInfo">
          <!-- Search: shown while typing / on new tab -->
          <svg class="oi oi-search" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232.49,215.51,185,168a92.12,92.12,0,1,0-17,17l47.53,47.54a12,12,0,0,0,17-17ZM44,112a68,68,0,1,1,68,68A68.07,68.07,0,0,1,44,112Z"/></svg>
          <!-- Secure: HTTPS page — site-controls "sliders", as in Chrome v117+ (P2-1) -->
          <svg class="oi oi-secure" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.6" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="2.6" fill="currentColor" stroke="none"/></svg>
          <!-- Not secure / cert error: warning triangle (P2-1) -->
          <svg class="oi oi-insecure" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M236.8,188.09,149.35,36.22a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM116,104a12,12,0,0,1,24,0v40a12,12,0,0,1-24,0Zm12,96a16,16,0,1,1,16-16A16,16,0,0,1,128,200Z"/></svg>
          <!-- Internal page (history, settings, …): app-window glyph (P2-1) -->
          <svg class="oi oi-internal" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V80H40V56ZM40,200V96H216V200Z"/></svg>
        </button>
        <!-- "Not secure" chip (P2-1): part of the field, before the input, shown on http. -->
        <span class="omni-chip" id="omni-chip" data-i18n="chrome.notSecure">Not secure</span>
        <div class="omni-input">
          <input id="searchBar" type="text" placeholder="Search or enter URL"
                 data-i18n-placeholder="chrome.omnibox"
                 aria-label="Address and search" data-i18n-label="chrome.addressBar"
                 role="combobox" aria-expanded="false" aria-autocomplete="list"
                 autocomplete="off" spellcheck="false">
          <!-- Inline completion, shown as dim text AFTER the caret. The typed
               half is transparent so the suggestion lines up with the input's
               own glyphs; Tab (or clicking the row) accepts it. -->
          <div id="omni-ghost" aria-hidden="true"><span class="typed"></span><span class="rest"></span></div>
          <!-- standard resting URL: host bright, scheme/path dimmed.
               Painted over the (text-transparent) input while it's unfocused. -->
          <div id="url-display" aria-hidden="true"></div>
        </div>
        <!-- Page actions live at the END OF THE FIELD, behind a divider: they
             act on the page the field is showing, so they belong to it rather
             than to the row of app-scoped icons further right. -->
        <span class="omni-divider" aria-hidden="true"></span>
        <button id="page-actions-btn" class="omni-action" type="button" title="Page actions" data-i18n-title="chrome.pageActions">
          <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M144,128a16,16,0,1,1-16-16A16,16,0,0,1,144,128ZM60,112a16,16,0,1,0,16,16A16,16,0,0,0,60,112Zm136,0a16,16,0,1,0,16,16A16,16,0,0,0,196,112Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Inline pomodoro pill — hidden until focus mode/timer is active -->
    <div id="pomodoro-pill" class="pomodoro-pill hidden" title="Click to manage timer" data-i18n-title="chrome.timer">
      <svg class="pill-ring" viewBox="0 0 28 28" width="28" height="28">
        <circle class="pill-ring-bg"   cx="14" cy="14" r="11"/>
        <circle class="pill-ring-fill" id="pill-ring-fill" cx="14" cy="14" r="11"/>
      </svg>
      <span class="pill-phase-dot" id="pill-phase-dot"></span>
      <span class="pill-time" id="pill-time">25:00</span>
    </div>

    <div class="trailing-icons">
      <!-- Profile switcher: coloured initial of this window's profile -->
      <button id="profile-btn" class="icon-btn" title="Profiles" data-i18n-title="chrome.profiles">
        <span id="profile-badge" class="profile-badge">P</span>
      </button>
      <!-- Extension browser-action buttons (electron-chrome-extensions) -->
      <browser-action-list id="ext-actions"></browser-action-list>
      <!-- Extensions: lists installed extensions; links to the Chrome Web Store -->
      <button id="extensions-btn" class="icon-btn" title="Extensions" data-i18n-title="chrome.extensions">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path class="i-line" d="M222.41,155.16a12,12,0,0,0-11.56-.69A16,16,0,0,1,188,139,16.2,16.2,0,0,1,202.8,124a15.83,15.83,0,0,1,8,1.5A12,12,0,0,0,228,114.7V72a20,20,0,0,0-20-20H176a40.15,40.15,0,0,0-12.62-29.16,39.67,39.67,0,0,0-29.94-10.76,40.08,40.08,0,0,0-37.34,37C96,50.07,96,51,96,52H64A20,20,0,0,0,44,72v28a40.15,40.15,0,0,0-29.16,12.62A40,40,0,0,0,41.1,179.9a28.3,28.3,0,0,0,2.9.1v28a20,20,0,0,0,20,20H208a20,20,0,0,0,20-20V165.31A12,12,0,0,0,222.41,155.16ZM204,204H68V165.31a12,12,0,0,0-17.15-10.84A15.9,15.9,0,0,1,42.8,156,16.2,16.2,0,0,1,28,141.06a16,16,0,0,1,22.82-15.52A12,12,0,0,0,68,114.7V76h42.7a12,12,0,0,0,10.83-17.15A15.9,15.9,0,0,1,120,50.8,16.19,16.19,0,0,1,134.94,36a16,16,0,0,1,15.53,22.81A12,12,0,0,0,161.31,76H204v24c-1,0-1.93,0-2.9.11A40,40,0,0,0,204,180h0Z"/><path class="i-fill" d="M165.78,224H208a16,16,0,0,0,16-16V170.35A8,8,0,0,0,212.94,163a23.37,23.37,0,0,1-8.94,1.77c-13.23,0-24-11.1-24-24.73s10.77-24.73,24-24.73a23.37,23.37,0,0,1,8.94,1.77A8,8,0,0,0,224,109.65V72a16,16,0,0,0-16-16H171.78a35.36,35.36,0,0,0,.22-4,36,36,0,0,0-72,0,35.36,35.36,0,0,0,.22,4H64A16,16,0,0,0,48,72v32.22a35.36,35.36,0,0,0-4-.22,36,36,0,0,0,0,72,35.36,35.36,0,0,0,4-.22V208a16,16,0,0,0,16,16h42.22"/></svg>
      </button>
      <!-- Reader mode: hidden until the page looks like an article -->
      <button id="reader-btn" class="icon-btn reader-btn hidden" title="Reader view" data-i18n-title="chrome.reader">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path class="i-line" d="M232,44H160a43.86,43.86,0,0,0-32,13.85A43.86,43.86,0,0,0,96,44H24A12,12,0,0,0,12,56V200a12,12,0,0,0,12,12H96a20,20,0,0,1,20,20,12,12,0,0,0,24,0,20,20,0,0,1,20-20h72a12,12,0,0,0,12-12V56A12,12,0,0,0,232,44ZM96,188H36V68H96a20,20,0,0,1,20,20V192.81A43.79,43.79,0,0,0,96,188Zm124,0H160a43.71,43.71,0,0,0-20,4.83V88a20,20,0,0,1,20-20h60Z"/><path class="i-fill" d="M240,56V200a8,8,0,0,1-8,8H160a24,24,0,0,0-24,23.94,7.9,7.9,0,0,1-5.12,7.55A8,8,0,0,1,120,232a24,24,0,0,0-24-24H24a8,8,0,0,1-8-8V56a8,8,0,0,1,8-8H88a32,32,0,0,1,32,32v87.73a8.17,8.17,0,0,0,7.47,8.25,8,8,0,0,0,8.53-8V80a32,32,0,0,1,32-32h64A8,8,0,0,1,240,56Z"/></svg>
      </button>
      <!-- Picture-in-Picture: hidden until the active tab plays video -->
      <button id="pip-btn" class="icon-btn pip-btn hidden" title="Picture-in-Picture" data-i18n-title="chrome.pip">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path class="i-line" d="M216,44H40A20,20,0,0,0,20,64V192a20,20,0,0,0,20,20H216a20,20,0,0,0,20-20V64A20,20,0,0,0,216,44ZM44,68H212v48H136a12,12,0,0,0-12,12v60H44ZM148,188V140h64v48Z"/><path class="i-fill" d="M216,48H40A16,16,0,0,0,24,64V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V64A16,16,0,0,0,216,48Zm0,144H136V128h80v64Z"/></svg>
      </button>
      <!-- Downloads: hidden until the first download of the session -->
      <button id="downloads-btn" class="icon-btn downloads-btn hidden" title="Downloads" data-i18n-title="chrome.downloads">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path class="i-line" d="M47.51,112.49a12,12,0,0,1,17-17L116,147V32a12,12,0,0,1,24,0V147l51.51-51.52a12,12,0,0,1,17,17l-72,72a12,12,0,0,1-17,0ZM216,204H40a12,12,0,0,0,0,24H216a12,12,0,0,0,0-24Z"/><path class="i-fill" d="M50.34,117.66A8,8,0,0,1,56,104h64V32a8,8,0,0,1,16,0v72h64a8,8,0,0,1,5.66,13.66l-72,72a8,8,0,0,1-11.32,0ZM216,208H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
        <span class="downloads-dot"></span>
      </button>
      <!-- Bookmark: filled ribbon when bookmarked, outline when not -->
      <button id="bookmark-btn" class="icon-btn" title="Bookmark" data-i18n-title="chrome.bookmark">
        <svg class="icon-svg bookmark-outline" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M243,96a20.33,20.33,0,0,0-17.74-14l-56.59-4.57L146.83,24.62a20.36,20.36,0,0,0-37.66,0L87.35,77.44,30.76,82A20.45,20.45,0,0,0,19.1,117.88l43.18,37.24-13.2,55.7A20.37,20.37,0,0,0,79.57,233L128,203.19,176.43,233a20.39,20.39,0,0,0,30.49-22.15l-13.2-55.7,43.18-37.24A20.43,20.43,0,0,0,243,96ZM172.53,141.7a12,12,0,0,0-3.84,11.86L181.58,208l-47.29-29.08a12,12,0,0,0-12.58,0L74.42,208l12.89-54.4a12,12,0,0,0-3.84-11.86L41.2,105.24l55.4-4.47a12,12,0,0,0,10.13-7.38L128,41.89l21.27,51.5a12,12,0,0,0,10.13,7.38l55.4,4.47Z"/></svg>
        <svg class="icon-svg bookmark-filled" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M234.29,114.85l-45,38.83L203,211.75a16.4,16.4,0,0,1-24.5,17.82L128,198.49,77.47,229.57A16.4,16.4,0,0,1,53,211.75l13.76-58.07-45-38.83A16.46,16.46,0,0,1,31.08,86l59-4.76,22.76-55.08a16.36,16.36,0,0,1,30.27,0l22.75,55.08,59,4.76a16.46,16.46,0,0,1,9.37,28.86Z"/></svg>
      </button>
      <!-- Focus: clock icon -->
      <button id="focus-btn" class="icon-btn" title="Focus mode" data-i18n-title="chrome.focusMode">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path class="i-line" d="M128,20A108,108,0,1,0,236,128,108.12,108.12,0,0,0,128,20Zm0,192a84,84,0,1,1,84-84A84.09,84.09,0,0,1,128,212Zm68-84a12,12,0,0,1-12,12H128a12,12,0,0,1-12-12V72a12,12,0,0,1,24,0v44h44A12,12,0,0,1,196,128Z"/><path class="i-fill" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm56,112H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48a8,8,0,0,1,0,16Z"/></svg>
      </button>
      <button id="menu-btn" class="icon-btn menu-btn" title="Menu" data-i18n-title="chrome.menu">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H40a12,12,0,0,1,0-24H216A12,12,0,0,1,228,128ZM40,76H216a12,12,0,0,0,0-24H40a12,12,0,0,0,0,24ZM216,180H40a12,12,0,0,0,0,24H216a12,12,0,0,0,0-24Z"/></svg>
      </button>
    </div>
  </div>

  <!-- Bookmark Bar -->
  <div id="tab-bar">
    <!-- Drag handle on the sidebar's right edge (side mode) to resize it -->
    <div id="sidebar-resizer" class="sidebar-resizer" title="Drag to resize" data-i18n-title="chrome.resizeSidebar"></div>
    <!-- Window controls — position/style set by JS based on platform -->
    <div id="window-controls" class="window-controls"></div>
    <!-- Create-a-Space form. Lives in the sidebar (chrome, outside the page
         bounds) so unlike the modals it needs no page-view collapse. -->
    <div id="space-create" class="space-create hidden" role="dialog" aria-label="Create a space" data-i18n-label="chrome.createSpace">
      <div class="sc-title" data-i18n="chrome.createSpace">Create a space</div>
      <div class="sc-sub">Spaces keep their own tabs, essentials and history.</div>
      <div class="sc-namerow">
        <button type="button" id="sc-emoji" class="sc-emoji" aria-label="Choose icon" title="Choose icon" data-i18n-label="chrome.chooseIcon" data-i18n-title="chrome.chooseIcon"></button>
        <input id="sc-name" class="sc-input" maxlength="24" placeholder="Space name" data-i18n-placeholder="chrome.spaceName">
      </div>
      <div id="sc-emoji-picker" class="emoji-picker hidden" role="listbox" aria-label="Icon"></div>
      <!-- Which cookie jar this space's tabs use: its own, the shared Default,
           or a named container shared with other spaces. -->
      <button class="sc-row sc-pick" id="sc-profile">
        <span>Profile</span><span class="sc-pick-val" id="sc-profile-val">Own</span>
      </button>
      <button class="sc-row" id="sc-theme">Edit Theme…</button>
      <div class="sc-actions">
        <button id="sc-create" class="btn btn-primary sc-btn">Create space</button>
        <button id="sc-cancel" class="btn btn-ghost sc-btn">Cancel</button>
      </div>
    </div>
    <!-- Essentials: pinned favourites (sidebar mode only, per profile) -->
    <div id="essentials" class="essentials" aria-label="Essentials" data-i18n-label="chrome.essentials"></div>
    <!-- Muted current-space label above the tab list (a "Space" header) -->
    <!-- The space you are in, and the way to switch: the reference designs all
         put identity at the top of the rail, not in a caption. -->
    <button id="space-header" class="space-header" aria-haspopup="menu" aria-expanded="false">
      <span class="space-badge profile-badge is-dot" id="space-badge" aria-hidden="true"></span>
      <span class="space-name" id="space-name">Space</span>
      <svg width="14" height="14" class="space-chevron" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216.49,104.49l-80,80a12,12,0,0,1-17,0l-80-80a12,12,0,0,1,17-17L128,159l71.51-71.52a12,12,0,0,1,17,17Z"/></svg>
    </button>
    <button id="tab-scroll-left" class="tab-scroll-btn" aria-label="Scroll tabs left" data-i18n-label="chrome.scrollTabsLeft">‹</button>
    <div id="tabs-container" role="tablist" aria-label="Tabs" data-i18n-label="chrome.tabs"></div>
    <button id="tab-scroll-right" class="tab-scroll-btn" aria-label="Scroll tabs right" data-i18n-label="chrome.scrollTabsRight">›</button>
    <div id="tab-actions">
      <button id="new-tab-btn" class="tab-add" aria-label="New tab" data-i18n-label="chrome.newTab"><span class="tab-add-glyph" aria-hidden="true">+</span><span class="tab-add-label" data-i18n="chrome.newTab">New tab</span></button>
    </div>
    <!-- Draggable filler: keeps the + next to the last tab, taking the slack up
         to the window controls / private badge. Collapses to 0 once tabs fill
         the strip, so the + falls back to the far right. -->
    <div id="tab-drag-spacer"></div>
    <div id="private-window-badge" class="private-badge">
      <svg width="10" height="10" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M116,116a16,16,0,1,1-16-16A16,16,0,0,1,116,116Zm40-16a16,16,0,1,0,16,16A16,16,0,0,0,156,100Zm72,20v96a12,12,0,0,1-19.6,9.29L186.67,207.5l-21.74,17.79a12,12,0,0,1-15.2,0L128,207.5l-21.73,17.79a12,12,0,0,1-15.2,0L69.33,207.5,47.6,225.29A12,12,0,0,1,28,216V120a100,100,0,0,1,200,0Zm-24,0a76,76,0,0,0-152,0v70.68l9.73-8a12,12,0,0,1,15.2,0L98.67,200.5l21.73-17.79a12,12,0,0,1,15.2,0l21.73,17.79,21.74-17.79a12,12,0,0,1,15.2,0l9.73,8Z"/></svg>
      Private
    </div>
    <!-- Sidebar foot (side mode only): workspace switcher (an avatar
         per workspace, active one labelled) + add + settings. -->
    <div id="sidebar-foot" class="sidebar-foot">
      <button id="sb-downloads" class="icon-btn sb-downloads hidden" title="Downloads" data-i18n-title="chrome.downloads">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path class="i-line" d="M47.51,112.49a12,12,0,0,1,17-17L116,147V32a12,12,0,0,1,24,0V147l51.51-51.52a12,12,0,0,1,17,17l-72,72a12,12,0,0,1-17,0ZM216,204H40a12,12,0,0,0,0,24H216a12,12,0,0,0,0-24Z"/><path class="i-fill" d="M50.34,117.66A8,8,0,0,1,56,104h64V32a8,8,0,0,1,16,0v72h64a8,8,0,0,1,5.66,13.66l-72,72a8,8,0,0,1-11.32,0ZM216,208H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <button id="sb-settings" class="icon-btn sb-settings" title="Settings" data-i18n-title="chrome.settings">
        <svg class="icon-svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M40,92H70.06a36,36,0,0,0,67.88,0H216a12,12,0,0,0,0-24H137.94a36,36,0,0,0-67.88,0H40a12,12,0,0,0,0,24Zm64-24A12,12,0,1,1,92,80,12,12,0,0,1,104,68Zm112,96H201.94a36,36,0,0,0-67.88,0H40a12,12,0,0,0,0,24h94.06a36,36,0,0,0,67.88,0H216a12,12,0,0,0,0-24Zm-48,24a12,12,0,1,1,12-12A12,12,0,0,1,168,188Z"/></svg>
      </button>
      <div id="sb-workspaces" class="sb-workspaces">
        <!-- "+N": how many spaces did not fit. Opens the same list the space
             pill at the top of the rail opens, so every space is one click
             away rather than an unknown amount of sideways scrolling. -->
        <button id="sb-ws-more" class="sb-ws-more" type="button" style="display:none"></button>
      </div>
      <button id="sb-add-ws" class="icon-btn sb-add-ws" title="New workspace" data-i18n-title="chrome.newWorkspace">+</button>
    </div>
  </div>

  <!-- Navigation / address bar -->
  <div id="bookmark-bar" class="bookmark-bar hidden">
    <div id="bookmark-bar-items"></div>
  </div>

  <!-- One-line notices that belong to the BROWSER rather than to a page: the
       offer to become the default browser, a captive portal that wants a
       sign-in. It sits in the same strip as the bookmark bar and is measured
       with it (bookmark-bar.js reportChromeHeight), so the page card moves down
       instead of being covered. Never more than one at a time, and every one of
       them is dismissible — a notice you cannot get rid of is a nag. -->
  <div id="notice-bar" class="notice-bar hidden" role="status">
    <span class="notice-text" id="notice-text"></span>
    <div class="notice-actions">
      <button class="btn btn-sm btn-primary" id="notice-primary" type="button"></button>
      <button class="btn btn-sm btn-ghost" id="notice-dismiss" type="button" data-i18n="notice.notNow">Not now</button>
    </div>
  </div>

  <!-- Content Area -->
  <div id="content-area"></div>

  <!-- Screen-reader announcements for the omnibox (P0-7): suggestion count on
       open, the active row on arrow. Visually hidden; polite so it never
       interrupts typing. -->
  <div id="omni-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Pomodoro Overlay -->
  <div id="pomodoro-overlay" class="pomodoro-overlay hidden">
    <div class="pomodoro-card">
      <div class="pomodoro-phase" id="pomodoro-phase">Focus</div>
      <div class="pomodoro-time" id="pomodoro-time">25:00</div>
      <div class="pomodoro-controls">
        <button id="pomodoro-start" class="btn btn-primary pom-btn">Start</button>
        <button id="pomodoro-skip" class="btn btn-ghost pom-btn">Skip</button>
        <button id="pomodoro-reset" class="btn btn-ghost pom-btn">Reset</button>
      </div>
      <div class="pomodoro-sessions" id="pomodoro-sessions"></div>
      <button id="pomodoro-close" class="surface-icon-btn pom-close" title="Close" data-i18n-title="chrome.close" aria-label="Close" data-i18n-label="chrome.close">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/></svg>
      </button>
    </div>
  </div>

  <!-- One-time hint the first time a tab runs in an isolated session -->

  <!-- Rename this window's profile -->
  <!-- One-field prompt, reused by anything that needs a line of text
       (an Essential's page, …). -->
  <div id="text-prompt" class="cm-overlay hidden">
    <div class="ri-card" role="dialog" aria-labelledby="tp-title">
      <div class="ri-title" id="tp-title">Edit</div>
      <input id="tp-input" class="ri-input" spellcheck="false">
      <div class="ri-actions">
        <button id="tp-cancel" class="btn btn-ghost ri-btn" data-i18n="chrome.cancel">Cancel</button>
        <button id="tp-save" class="btn btn-primary ri-btn" data-i18n="chrome.save">Save</button>
      </div>
    </div>
  </div>
  <div id="profile-rename-modal" class="cm-overlay hidden">
    <div class="ri-card" role="dialog" aria-label="Edit profile" data-i18n-label="chrome.editProfile">
      <div class="ri-title">Edit profile</div>
      <div class="prf-row">
        <button type="button" id="prf-emoji" class="prf-emoji" aria-label="Choose emoji" title="Choose emoji" data-i18n-label="chrome.chooseEmoji" data-i18n-title="chrome.chooseEmoji">🙂</button>
        <input id="prf-input" class="ri-input" maxlength="24" placeholder="e.g. Work">
      </div>
      <div id="prf-emoji-picker" class="emoji-picker hidden" role="listbox" aria-label="Emoji"></div>
      <div class="prf-hint">Choose the dot to keep the avatar minimal.</div>
      <div class="ri-actions">
        <button id="prf-cancel" class="btn btn-ghost ri-btn">Cancel</button>
        <button id="prf-save" class="btn btn-primary ri-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
  <!-- Chrome modules (classic scripts, no bundler): each registers a factory on
       window.Northstar, which renderer.js wires up. Order matters — these must run
       before renderer.js. -->
  <script src="../lib/i18n.js"></script>
  <script src="../lib/keys.js"></script>
  <script src="../lib/util.js"></script>
  <script src="../lib/hover-label.js"></script>
  <script src="../lib/bookmark-bar.js"></script>
  <script src="../renderer.js"></script>
</body>
</html>
