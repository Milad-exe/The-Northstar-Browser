<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; script-src 'self';" />
  <title>Theme</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="../styles/theme-editor.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Same instrument as the Appearance section, in a panel. The markup is
       duplicated here rather than templated because it is markup, not logic —
       renderer/lib/theme-editor.js drives both copies and is the single place
       any behaviour lives. -->
  <div class="surface-card" id="panel">
    <div class="surface-head">
      <span class="surface-title" id="tp-title">Theme</span>
      <!-- Only shown when the panel is editing a SPACE: clears its own theme so
           it follows the global setting again. -->
      <button class="btn btn-ghost btn-sm" id="tp-reset" type="button" hidden>Reset</button>
      <button class="surface-icon-btn" id="tp-close" type="button" title="Close" aria-label="Close">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
      </button>
    </div>
    <div class="tp-scroll">
      <div class="theme-editor" id="theme-editor" hidden>
        <div class="te-stage">
          <div class="te-modes" id="te-mode-seg" role="radiogroup" aria-label="Mode">
            <button type="button" data-m="dark" class="on" role="radio" aria-checked="true" title="Dark" aria-label="Dark">
              <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/></svg>
            </button>
            <button type="button" data-m="light" role="radio" aria-checked="false" tabindex="-1" title="Light" aria-label="Light">
              <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg>
            </button>
          </div>

          <div class="te-canvas" id="te-canvas" role="application"
               aria-label="Gradient field — drag a colour to move where it pools">
            <div class="te-dots" id="te-dots"></div>
          </div>

          <div class="te-palette" id="te-palette" role="group" aria-label="Pool colour"></div>

          <div class="te-bar">
            <div class="te-roles" id="te-roles"></div>
            <div class="te-tools">
              <button type="button" id="te-add" title="Add a colour" aria-label="Add a colour">
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>
              </button>
              <button type="button" id="te-remove" title="Remove the last colour" aria-label="Remove the last colour">
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128Z"/></svg>
              </button>
              <button type="button" id="te-scatter" title="Spread the colours out" aria-label="Spread the colours out evenly">
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M136,40V216a8,8,0,0,1-16,0V40a8,8,0,0,1,16,0ZM96,120H35.31l18.35-18.34A8,8,0,0,0,42.34,90.34l-32,32a8,8,0,0,0,0,11.32l32,32a8,8,0,0,0,11.32-11.32L35.31,136H96a8,8,0,0,0,0-16Zm149.66,2.34-32-32a8,8,0,0,0-11.32,11.32L220.69,120H160a8,8,0,0,0,0,16h60.69l-18.35,18.34a8,8,0,0,0,11.32,11.32l32-32A8,8,0,0,0,245.66,122.34Z"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="te-controls">
          <label class="te-ctl">
            <span class="te-ctl-name">Shade</span>
            <span class="te-ctl-track" id="te-shade-track">
              <input id="te-shade" type="range" min="0" max="100" value="50" aria-label="Shade">
            </span>
            <span class="te-ctl-val" id="te-shade-val">50</span>
          </label>
          <label class="te-ctl">
            <span class="te-ctl-name">Intensity</span>
            <span class="te-ctl-track" id="te-intensity-track">
              <input id="te-intensity" type="range" min="0" max="100" value="70" aria-label="Intensity">
            </span>
            <span class="te-ctl-val" id="te-intensity-val">70</span>
          </label>
          <label class="te-ctl">
            <span class="te-ctl-name">Grain</span>
            <span class="te-ctl-track te-wave">
              <svg class="te-wave-art" viewBox="0 0 240 24" aria-hidden="true" preserveAspectRatio="none">
                <path d="M0 12 L240 12"/>
              </svg>
              <input id="te-grain" type="range" min="0" max="100" value="0" aria-label="Grain">
            </span>
            <span class="te-ctl-val" id="te-grain-val">0</span>
          </label>
        </div>

        <p class="te-warn" id="te-warn" role="status" hidden></p>

      </div>
    </div>
    <!-- The foot sits OUTSIDE the scroller here, unlike the Settings page where
         it is the end of a section you scrolled to anyway. A popup is shorter
         than the instrument inside it, so at the end of the scroll "Done" — and
         the only way to delete the theme you are looking at — was below the
         fold on a window of ordinary height. -->
    <div class="te-foot tp-foot">
      <button class="btn btn-ghost btn-sm" id="te-cancel" type="button">Done</button>
    </div>
  </div>
  <script src="../lib/theme-editor.js"></script>
  <script src="../lib/surface-anim.js"></script>
  <script src="panel.js"></script>
</body>
</html>
