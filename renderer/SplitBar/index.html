<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; script-src 'self';" />
  <title>Split</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="m-0 select-none overflow-hidden bg-transparent font-sans text-primary">
  <!-- Divider: drag to resize the two panes. -->
  <div id="divider" class="hidden"><span class="grip"></span></div>

  <!-- Pane handle: a grab pill at the top centre of a pane. Hovering swaps it
       for the reposition pad — send this pane to the top / left / right / bottom. -->
  <div id="handle" class="hidden">
    <div class="pill" title="Move this pane">
      <svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M108,60A16,16,0,1,1,92,44,16,16,0,0,1,108,60Zm56,16a16,16,0,1,0-16-16A16,16,0,0,0,164,76ZM92,112a16,16,0,1,0,16,16A16,16,0,0,0,92,112Zm72,0a16,16,0,1,0,16,16A16,16,0,0,0,164,112ZM92,180a16,16,0,1,0,16,16A16,16,0,0,0,92,180Zm72,0a16,16,0,1,0,16,16A16,16,0,0,0,164,180Z"/></svg>
    </div>
    <div class="pad" role="group" aria-label="Move pane">
      <button class="dir" data-dir="top" tabindex="-1" title="Move to top" aria-label="Move to top">
        <svg width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208.49,120.49a12,12,0,0,1-17,0L140,69V216a12,12,0,0,1-24,0V69L64.49,120.49a12,12,0,0,1-17-17l72-72a12,12,0,0,1,17,0l72,72A12,12,0,0,1,208.49,120.49Z"/></svg>
      </button>
      <button class="dir" data-dir="left" tabindex="-1" title="Move to left" aria-label="Move to left">
        <svg width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"/></svg>
      </button>
      <button class="dir" data-dir="right" tabindex="-1" title="Move to right" aria-label="Move to right">
        <svg width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.48a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"/></svg>
      </button>
      <button class="dir" data-dir="bottom" tabindex="-1" title="Move to bottom" aria-label="Move to bottom">
        <svg width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208.49,152.49l-72,72a12,12,0,0,1-17,0l-72-72a12,12,0,0,1,17-17L116,187V40a12,12,0,0,1,24,0V187l51.51-51.52a12,12,0,0,1,17,17Z"/></svg>
      </button>
    </div>
  </div>
  <script src="bar.js"></script>
</body>
</html>
