<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>This page couldn’t load</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <script src="../lib/i18n.js"></script>
  <script src="../lib/util.js"></script>
  <style>
    /* Reset only what the page itself uses. A universal `* { padding: 0 }`
       here outranked the layered shared .btn styles and left the buttons with
       no padding. */
    html, body, h1, p { margin: 0; padding: 0; }
    html, body {
      height: 100%; font-family: var(--font);
      background: var(--page); color: var(--text);
      overflow: hidden; -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
    }

    /* A flat page, like the new-tab page. A coloured glow here made a failure
       look like a splash screen. */
    .scene { position: fixed; inset: 0; background: var(--page); }
    .glyph { width: 40px; height: 40px; color: var(--text-3); margin-bottom: var(--sp-6); }

    .stage {
      position: relative; z-index: 1; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 40px; text-align: center; box-sizing: border-box;
    }
    /* Plain language, no big status number: a network failure is not a 404. */
    .title {
      font-size: var(--fs-display); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance;
      line-height: 1.1; color: var(--text); max-width: 720px;
    }
    .detail { font-size: var(--fs-body); color: var(--text-2); margin-top: var(--sp-5); max-width: 460px; line-height: 1.5; }
    .url {
      font-family: var(--mono); font-size: var(--fs-body); color: var(--text-3);
      margin-top: var(--sp-4); max-width: 560px; word-break: break-all;
      user-select: text; -webkit-user-select: text;
    }
    /* The raw Chromium error name, for people who want it. */
    .code {
      font-family: var(--mono); font-size: var(--fs-micro); color: var(--text-3);
      margin-top: var(--sp-2); letter-spacing: 0.02em;
      user-select: text; -webkit-user-select: text;
    }
    .code:empty { display: none; }

    .actions { display: flex; gap: var(--sp-4); margin-top: 28px; }
    /* Buttons are shared — see SHARED CONTROLS in renderer/styles/ui.css. */
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>

  <main class="stage">
    <svg class="glyph" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,20a108,108,0,0,0,0,216,12,12,0,0,0,7.49-21.37h0c-.25-.2-17.55-14.39-27.9-42.63H128a12,12,0,0,0,0-24H101.48a135.88,135.88,0,0,1,0-40h53A133.77,133.77,0,0,1,156,128a12,12,0,0,0,24,0,159,159,0,0,0-1.25-20h30.82A83.49,83.49,0,0,1,212,128a12,12,0,0,0,24,0A108.12,108.12,0,0,0,128,20ZM97.79,49.64A140.82,140.82,0,0,0,82.29,84H56.48A84.46,84.46,0,0,1,97.79,49.64Zm0,156.72A84.46,84.46,0,0,1,56.48,172H82.29A140.82,140.82,0,0,0,97.79,206.36ZM77.25,148H46.43a83.52,83.52,0,0,1,0-40H77.25a160.63,160.63,0,0,0,0,40Zm30.34-64a116.61,116.61,0,0,1,10-20.77A107.75,107.75,0,0,1,128,49a113.2,113.2,0,0,1,20.39,35Zm66.12,0a140.82,140.82,0,0,0-15.5-34.36A84.46,84.46,0,0,1,199.52,84Zm50.78,92.49L209,192l15.52,15.51a12,12,0,0,1-17,17L192,209l-15.51,15.52a12,12,0,0,1-17-17L175,192l-15.52-15.51a12,12,0,0,1,17-17L192,175l15.51-15.52a12,12,0,0,1,17,17Z"/></svg>
    <h1 class="title" id="title">This page couldn’t load</h1>
    <p class="detail" id="detail">Try again.</p>
    <p class="url" id="url"></p>
    <p class="code" id="code"></p>
    <div class="actions">
      <button class="btn btn-primary" id="btn-retry" data-i18n="error.tryAgain">Try again</button>
      <button class="btn btn-ghost" id="btn-back" data-i18n="error.back">Go back</button>
    </div>
  </main>

  <script>
    try { window.Northstar.i18n.init((window.northstarSettings?.getSync() || {}).i18n || {}); window.Northstar.i18n.apply(document); } catch {}
    const T = (k, f) => {
      try { const v = window.Northstar?.i18n?.t(k); return (v && v !== k) ? v : f; }
      catch { return f; }
    };
    const params = new URLSearchParams(location.search);
    const failedUrl = params.get('url') || '';
    const code = params.get('code') || '';
    const desc = params.get('desc') || '';

    if (failedUrl) document.getElementById('url').textContent = failedUrl;
    // ERR_NAME_NOT_RESOLVED etc. — only when it looks like one.
    if (/^ERR_[A-Z_]+$/.test(desc)) document.getElementById('code').textContent = desc;

    // Plain-language copy per net error (renderer/lib/util.js errorCopy).
    const copy = window.Northstar.util.errorCopy(code);
    const title = T(`error.${copy.key}.title`, copy.title);
    document.getElementById('title').textContent = title;
    document.getElementById('detail').textContent = T(`error.${copy.key}.detail`, copy.detail);
    document.title = title;

    // Use the tab's navigation API (available via preload) instead of window history
    document.getElementById('btn-retry').addEventListener('click', () => {
      if (failedUrl) window.electronAPI.navigateActiveTab(failedUrl);
    });
    document.getElementById('btn-back').addEventListener('click', () => {
      window.electronAPI.activeTabGoBack();
    });
  </script>
</body>
</html>
