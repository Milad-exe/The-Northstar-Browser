<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>History</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/page.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <div class="page-column">
    <div class="page-head">
      <h1 data-i18n="history.title">History</h1>
      <span class="count" id="count"></span>
      <button class="page-btn danger" id="clear-all" data-i18n="history.clear">Clear history…</button>
    </div>

    <label class="page-search">
      <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232.49,215.51,185,168a92.12,92.12,0,1,0-17,17l47.53,47.54a12,12,0,0,0,17-17ZM44,112a68,68,0,1,1,68,68A68.07,68.07,0,0,1,44,112Z"/></svg>
      <input id="search" type="text" placeholder="Search history" data-i18n-placeholder="history.search"
             autocomplete="off" spellcheck="false">
    </label>

    <div id="list"></div>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/display-url.js"></script>
  <script src="history.js"></script>
</body>
</html>
