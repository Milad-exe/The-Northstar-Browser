<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; script-src 'self';" />
  <title>History</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/page.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <div class="page-column">
    <div class="page-head">
      <h1 data-i18n="history.title">History</h1>
      <span class="count" id="count"></span>
      <button class="page-btn danger" id="clear-all" data-i18n="history.clear">Clear history…</button>
    </div>

    <label class="page-search">
      <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
      <input id="search" type="text" placeholder="Search history" data-i18n-placeholder="history.search"
             autocomplete="off" spellcheck="false">
    </label>

    <div id="list"></div>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/display-url.js"></script>
  <script src="history.js"></script>
</body>
</html>
