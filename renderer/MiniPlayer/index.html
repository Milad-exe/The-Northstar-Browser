<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; script-src 'self';" />
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card" id="card">
    <!-- ── Single full-width media bar ─────────────────────────── -->
    <div id="expanded">
      <button class="ctl big" id="x-toggle" aria-label="Play or pause"><span class="ic-toggle"></span></button>
      <img class="art" id="x-art" alt="" style="display:none">
      <div class="track" id="x-track" title="Seek">
        <div class="fill" id="x-fill"></div>
        <span class="t-el" id="x-el">0:00</span>
        <span class="t-title" id="x-title">Playing media…</span>
        <span class="t-rem" id="x-rem">-0:00</span>
      </div>
      <div class="volwrap">
        <button class="ctl" id="x-mute" aria-label="Mute or unmute"><span class="ic-mute"></span></button>
        <input type="range" id="x-vol" min="0" max="100" value="100" title="Volume">
      </div>
      <button class="ctl" id="x-goto" aria-label="Go to tab"><span class="ic-goto"></span></button>
      <button class="ctl" id="x-close" aria-label="Hide">
        <svg width="11" height="11" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
      </button>
    </div>
  </div>

  <!-- Shared icon templates (cloned into .ic-* slots by miniplayer.js) -->

  <script src="miniplayer.js"></script>
</body>
</html>
