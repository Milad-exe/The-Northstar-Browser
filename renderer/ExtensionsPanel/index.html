<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; script-src 'self';" />
  <title>Extensions</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="panel" class="surface-card">
    <div class="surface-head">
      <span class="surface-title" data-i18n="chrome.extensions">Extensions</span>
      <button id="close-btn" class="surface-icon-btn" title="Close" data-i18n-title="chrome.close" aria-label="Close" data-i18n-label="chrome.close">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
      </button>
    </div>

    <div id="list" class="surface-body surface-scroll"></div>

    <!-- The way to get more extensions -->
    <a id="store-link" class="surface-foot" href="#" data-i18n="ext.store">Find extensions</a>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/keys.js"></script>
  <script src="../lib/surface-anim.js"></script>
  <script src="panel.js"></script>
</body>
</html>
