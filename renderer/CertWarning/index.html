<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Connection is not private</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <script src="../lib/i18n.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; font-family: var(--font);
      background: var(--page); color: var(--text);
      overflow: auto; -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
    }
    /* Warning wallpaper: the danger token instead of the accent, so this page
       never reads like an ordinary error. */
    .scene {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(120% 82% at 50% 0%, color-mix(in srgb, var(--danger) 18%, transparent), transparent 60%),
        linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 44%, var(--page) 100%);
    }
    .stage {
      position: relative; z-index: 1; min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 56px 40px; text-align: center;
    }
    .badge {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--danger) 16%, transparent);
      color: var(--danger); margin-bottom: 20px;
    }
    .title { font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; letter-spacing: -0.02em; }
    .host { font-family: var(--mono); font-size: 13px; color: var(--danger); margin-top: 8px; user-select: text; }
    .detail { font-size: 14px; color: var(--text-2); margin-top: 10px; max-width: 460px; line-height: 1.5; }
    .code { font-family: var(--mono); font-size: var(--fs-small); color: var(--text-2); margin-top: 10px; letter-spacing: 0.04em; }

    .actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
    /* Buttons are shared — see SHARED CONTROLS in renderer/styles/ui.css. */

    /* The way through is deliberately plain text, not a button: proceeding is
       the rare, informed case, not the obvious next step. */
    .advanced {
      margin-top: 26px; width: 100%; max-width: 560px;
      text-align: left;
    }
    .adv-toggle {
      background: none; border: none; color: var(--text-2); font-size: var(--fs-body);
      padding: 4px 0; font-weight: 500;
    }
    .adv-toggle:hover { color: var(--text-2); }
    .adv-body { display: none; margin-top: 12px; }
    .advanced.open .adv-body { display: block; }
    .cert {
      border: 1px solid var(--border); border-radius: var(--r-md);
      background: var(--surface); padding: 12px 14px;
      font-family: var(--mono); font-size: var(--fs-small); color: var(--text-2);
      user-select: text; -webkit-user-select: text;
    }
    .cert div { display: flex; gap: 10px; padding: 2px 0; word-break: break-all; }
    .cert span:first-child { color: var(--text-2); min-width: 92px; flex-shrink: 0; }
    .proceed {
      margin-top: 12px; background: none; border: none; padding: 4px 0;
      color: var(--danger); font-size: var(--fs-body); font-weight: 600; text-align: left;
    }
    .proceed:hover { filter: brightness(1.15); }
    .proceed-note { color: var(--text-2); font-size: var(--fs-small); margin-top: 4px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <main class="stage">
    <div class="badge" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M116,132V96a12,12,0,0,1,24,0v36a12,12,0,0,1-24,0Zm12,56a16,16,0,1,0-16-16A16,16,0,0,0,128,188ZM228,56v56c0,54.29-26.32,87.22-48.4,105.29-23.71,19.39-47.44,26-48.44,26.29a12.1,12.1,0,0,1-6.32,0c-1-.28-24.73-6.9-48.44-26.29C54.32,199.22,28,166.29,28,112V56A20,20,0,0,1,48,36H208A20,20,0,0,1,228,56Zm-24,4H52v52c0,35.71,13.09,64.69,38.91,86.15A126.14,126.14,0,0,0,128,219.38a126.28,126.28,0,0,0,37.09-21.23C190.91,176.69,204,147.71,204,112Z"/></svg>
    </div>
    <h1 class="title" id="title">This connection is not private</h1>
    <div class="host" id="host"></div>
    <p class="detail" id="detail"></p>
    <div class="code" id="code"></div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-back" data-i18n="cert.backToSafety">Back to safety</button>
      <button class="btn btn-ghost" id="btn-retry" data-i18n="cert.tryAgain">Try again</button>
    </div>

    <div class="advanced" id="advanced">
      <button class="adv-toggle" id="adv-toggle" aria-expanded="false">Advanced ▸</button>
      <div class="adv-body">
        <div class="cert" id="cert"></div>
        <button class="proceed" id="btn-proceed">Continue to <span id="proceed-host"></span> anyway</button>
        <div class="proceed-note">
          Only if you know why this certificate is wrong. Attackers use this screen's
          exact conditions to read what you send. The exception applies to this
          certificate on this host, and is forgotten when the browser closes.
        </div>
      </div>
    </div>
  </main>

  <script>
    try { window.Northstar.i18n.init((window.northstarSettings?.getSync() || {}).i18n || {}); window.Northstar.i18n.apply(document); } catch {}
    const T = (k, v) => { try { return window.Northstar.i18n.t(k, v); } catch { return k; } };
    const p = new URLSearchParams(location.search);
    const failedUrl = p.get('url') || '';
    const host = p.get('host') || '';
    const fingerprint = p.get('fingerprint') || '';

    document.getElementById('title').textContent = p.get('title') || 'This connection is not private';
    document.getElementById('detail').textContent = p.get('detail') || '';
    document.getElementById('host').textContent = host;
    document.getElementById('proceed-host').textContent = host;
    document.getElementById('code').textContent = p.get('error') || '';
    document.title = (p.get('title') || 'Connection is not private');

    const fmt = (iso) => { if (!iso) return '—'; try { return window.Northstar.i18n.dateTime(iso); } catch { return iso; } };
    const rows = [
      [T('cert.issuedTo'), p.get('subject')],
      [T('cert.issuedBy'), p.get('issuer')],
      [T('cert.validFrom'), fmt(p.get('validFrom'))],
      [T('cert.validTo'), fmt(p.get('validTo'))],
      [T('cert.fingerprint'), fingerprint],
    ];
    const cert = document.getElementById('cert');
    for (const [label, value] of rows) {
      const row = document.createElement('div');
      const l = document.createElement('span'); l.textContent = label;
      const v = document.createElement('span'); v.textContent = value || '—';
      row.append(l, v);
      cert.appendChild(row);
    }

    const adv = document.getElementById('advanced');
    document.getElementById('adv-toggle').addEventListener('click', (e) => {
      const open = adv.classList.toggle('open');
      e.target.textContent = T('cert.advanced') + (open ? ' ▾' : ' ▸');
      e.target.setAttribute('aria-expanded', String(open));
    });

    document.getElementById('btn-back').addEventListener('click', () => window.electronAPI.activeTabGoBack());
    document.getElementById('btn-retry').addEventListener('click', () => {
      if (failedUrl) window.electronAPI.navigateActiveTab(failedUrl);
    });
    document.getElementById('btn-proceed').addEventListener('click', () => {
      window.certWarning.proceed(host, fingerprint, failedUrl);
    });
  </script>
</body>
</html>
